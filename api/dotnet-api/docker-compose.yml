version: '3.8'

services:
  spicy-todo-dotnet-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spicy-todo-dotnet-api
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

